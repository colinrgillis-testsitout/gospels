<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christian Texts · Gospel Reader</title>
<meta name="description" content="A Sefaria-style reader for the Christian gospels, with parallels and connections.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><h1>Christian Texts</h1><small>The Four Gospels</small></div>
    <button class="iconbtn" id="smaller" aria-label="Smaller text">A−</button>
    <button class="iconbtn" id="bigger" aria-label="Larger text">A+</button>
    <button class="iconbtn" id="theme" aria-label="Toggle theme">◐</button>
  </div>
  <div class="search"><input id="q" type="search" placeholder="Search the gospels…" autocomplete="off"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="ctl" id="ctl"></div>
</header>

<div class="layout">
  <main id="main"></main>
  <aside id="panel" aria-live="polite"></aside>
</div>
<footer>
  Texts: King James Version (1769), American Standard Version (1901) and Bible in Basic English, all in the public domain. Connections are starter data and are being expanded passage by passage.
</footer>

<script type="module" src="/src/main.js"></script>
</body>
</html>
